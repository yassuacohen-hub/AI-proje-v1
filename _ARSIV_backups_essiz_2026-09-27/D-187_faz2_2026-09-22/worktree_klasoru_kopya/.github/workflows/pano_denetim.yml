name: Pano Denetim

# D-66/D-77: zamanlanmis kosu SADECE rapor uretir. Yazma yetkisi manuel
# tetiklemeye baglidir; otomat gozetimsiz pano degistirmez.
on:
  schedule:
    - cron: "0 * * * *"   # saatlik, read-only
  workflow_dispatch:
    inputs:
      uygula:
        description: "Izinli duzeltmeleri uygula (plana_ac/bitis_temizle/archive)"
        type: boolean
        default: false

jobs:
  denetim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Denetim
        run: python scripts/pano_denetim.py ${{ inputs.uygula && '--uygula' || '' }}
      - name: Rapor yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync_report
          path: data/orchestrator/sync_report.json
