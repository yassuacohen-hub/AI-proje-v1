# Huginn Data Insights - docker-compose (Faz 1, 2026-09-09)
# Kullanim:
#   API + Supabase (prod benzeri):   docker compose up -d --build api
#   API + yerel PG (dev/test):       docker compose --profile localdb up -d --build
#     -> DATABASE_URL'i localhost:5433'e cevirerek .env.local ile calistir
#   Eski Streamlit arayuzu:          docker compose --profile legacy up -d streamlit

services:
  # Ana servis: FastAPI + vanilla JS dashboard
  api:
    build: .
    command: ["uvicorn", "web_app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - PYTHONPATH=/app:/app/src
    volumes:
      - ./web_dashboard:/app/web_dashboard:ro
      - ./logs:/app/logs
    restart: unless-stopped

  # Faz 3: yerel PostgreSQL — Y9 testleri + EXPLAIN ANALYZE pooler timeout'suz
  # Restore: scripts/backup_db.py dump'i -> scripts/restore_db.py ile buraya yukle
  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    environment:
      POSTGRES_DB: huginn
      POSTGRES_USER: huginn
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-huginn_local_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huginn -d huginn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Legacy: eski Streamlit arayuzu ve yardimci isler ----
  streamlit:
    build: .
    profiles: ["legacy"]
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app:/app/src
    restart: unless-stopped

  scraper:
    build: .
    profiles: ["legacy"]
    command: ["python", "scripts/refresh_pipeline.py"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app:/app/src

  healthcheck:
    build: .
    profiles: ["legacy"]
    command: ["python", "src/company_master/orchestrator/health_check.py"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app:/app/src
      - API_BASE_URL=http://api:8000

  telegram-bot:
    build: .
    profiles: ["legacy"]
    command: ["python", "-m", "company_master.telegram.bot_service"]
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app:/app/src
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

volumes:
  pgdata: