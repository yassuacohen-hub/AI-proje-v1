# ================================================================
# POSTGRESQL HBA CONFIGURATION - HUGINN DATA INSIGHTS
# Security Hardening: Zero Trust Network Access
# Only Docker Bridge Network (172.16.0.0/12) + Localhost allowed
# All external connections REJECTED
# ================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ------------------------------------------------------------
# LOCAL CONNECTIONS (Unix Socket) - Superuser only
# ------------------------------------------------------------
local   all             postgres                                peer
local   all             hugin_admin                             scram-sha-256
local   all             all                                     reject

# ------------------------------------------------------------
# IPv4 LOCALHOST - Container internal & host validation
# ------------------------------------------------------------
# Kong, FastAPI, Celery workers connect via Docker bridge (172.16.0.0/12)
# Host machine validation only (127.0.0.1/32)
host    all             hugin_admin         127.0.0.1/32            scram-sha-256
host    all             hugin_admin         172.16.0.0/12           scram-sha-256
host    all             hugin_readonly      172.16.0.0/12           scram-sha-256
host    all             hugin_migrator      172.16.0.0/12           scram-sha-256
host    all             hugin_replication   172.16.0.0/12           scram-sha-256

# ------------------------------------------------------------
# REPLICATION CONNECTIONS (Physical replication only)
# ------------------------------------------------------------
host    replication     hugin_replication   172.16.0.0/12           scram-sha-256

# ------------------------------------------------------------
# EXPLICIT REJECTION - All other IPv4 addresses
# This is the critical security rule: DENY by default
# ------------------------------------------------------------
host    all             all             0.0.0.0/0                 reject

# ------------------------------------------------------------
# IPv6 CONNECTIONS - Disabled entirely (not used in our architecture)
# ------------------------------------------------------------
# ::1 is localhost IPv6 - explicitly reject to prevent accidental binding
host    all             all             ::1/128                   reject
# All other IPv6 - reject
host    all             all             ::/0                      reject

# ================================================================
# USER ROLE DEFINITIONS (for reference - created via init scripts)
# ================================================================
# CREATE ROLE hugin_admin WITH LOGIN PASSWORD '...' CREATEDB CREATEROLE;
# CREATE ROLE hugin_readonly WITH LOGIN PASSWORD '...' NOINHERIT;
# CREATE ROLE hugin_migrator WITH LOGIN PASSWORD '...' NOINHERIT;
# CREATE ROLE hugin_replication WITH LOGIN PASSWORD '...' REPLICATION;
#
# GRANT CONNECT ON DATABASE hugin_commercial_db TO hugin_readonly, hugin_migrator;
# GRANT USAGE ON SCHEMA public TO hugin_readonly;
# GRANT SELECT ON ALL TABLES IN SCHEMA public TO hugin_readonly;
# ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO hugin_readonly;
#
# GRANT USAGE ON SCHEMA public TO hugin_migrator;
# GRANT CREATE ON SCHEMA public TO hugin_migrator;
# GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO hugin_migrator;
# GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO hugin_migrator;
# ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO hugin_migrator;
# ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO hugin_migrator;
# ================================================================

# ------------------------------------------------------------
# SECURITY NOTES:
# ------------------------------------------------------------
# 1. scram-sha-256: Strongest password hashing available in PG16
# 2. 172.16.0.0/12: Docker default bridge subnet (covers all containers)
# 3. 0.0.0.0/0 reject: Explicit deny-all as last rule (defense in depth)
# 4. No host.docker.internal: Containers use service names (hugin-db)
# 5. IPv6 disabled: Reduces attack surface
# 6. peer auth for postgres local: OS-level auth for superuser only
# 7. No trust authentication anywhere: Never allow passwordless access
# 8. Connection pooling (PgBouncer) should connect as hugin_admin from 172.16.0.0/12
# ------------------------------------------------------------