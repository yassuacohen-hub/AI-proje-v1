name: Anthropic CI Hata Açıklama

# Öneri #2 (hemen): CI kırmızı olunca başarısız job loglarını Claude özetler,
# kök neden + çözüm önerisini PR yorumuna (PR yoksa job özetine) yazar.
# Not: workflow_run tetikleyicisi yalnızca varsayılan daldaki workflow dosyasından çalışır.
on:
  workflow_run:
    workflows: ["CI Pipeline (Copilot v2)"]
    types: [completed]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  actions: read

jobs:
  explain:
    name: Explain CI failure with Claude
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/anthropic-oidc

      - name: Explain failed jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: python scripts/anthropic_pr_review.py --mode ci-failure
