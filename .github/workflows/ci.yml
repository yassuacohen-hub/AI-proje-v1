name: OSINT Scraper Motoru CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Lint
        run: |
          pip install flake8
          flake8 src/ scripts/ --max-line-length=120 --exclude=__pycache__

      - name: Test
        run: |
          PYTHONPATH=src pytest tests/ -v

      - name: Quality gate smoke test
        run: |
          PYTHONPATH=src python -m company_master.engine.osint_engine quality ostim-detail --min-score 30

  post-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run post-scrape workflow
        run: |
          PYTHONPATH=src python scripts/post_scrape_workflow.py

      - name: Validate output exists
        run: |
          test -f data/ostim/firmalar_detayli_validated.jsonl