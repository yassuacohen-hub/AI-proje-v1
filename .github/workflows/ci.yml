name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-app.txt
        pip install pytest pytest-cov black flake8
    
    - name: Lint with flake8
      run: |
        # Exit-zero treats all errors as warnings
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Format with black
      run: |
        black --check src/ tests/
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Build Docker image
      run: |
        docker build -t huginn-data-insights:${{ github.sha }} .
    
    - name: Security scan
      run: |
        # Basic security scan with bandit
        pip install bandit
        bandit -r src/ -f json -o bandit-report.json || true
    
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-app.txt
    
    - name: Deploy to Streamlit Cloud (example)
      run: |
        echo "Deploy commands would go here"
        # For Streamlit Community Cloud:
        # streamlit deploy app.py
        # Or for other platforms:
        # docker push your-registry/huginn-data-insights:latest