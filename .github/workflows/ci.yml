name: CI Pipeline (Copilot v2)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  # TEST-CI-01: olculen kapsam ~%88; taban 85 (altina dusurulmez).
  COVERAGE_THRESHOLD: 85
  # TEST-CI-01: tek testin asili kalmasi tum isi kilitlemesin (pytest-timeout).
  PYTEST_TIMEOUT_SN: 300

jobs:
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8 black
      - name: flake8 (syntax errors only)
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: flake8 (style)
        run: |
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: black --check (FMT-01 tamamlanana kadar bilgilendirici)
        continue-on-error: true
        run: black --check src/ tests/

  test:
    name: Tests + Coverage
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: huginn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/huginn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pytest pytest-cov pytest-timeout
          echo "# CI ortami: gercek gizli bilgi yok" > .env
      - name: Init schema
        run: |
          python -c "from src.company_master.db.connection import init_db; init_db()"
          python -c "import glob; from src.company_master.db.connection import init_db; [init_db(sql_path=p) for p in sorted(glob.glob('src/company_master/schema/migrations/*.sql'))]"
      - name: Kodlama denetimi (BOM / NUL / 0-bayt / UTF-16) — KR-4
        run: |
          python scripts/kodlama_denetim.py
      - name: Pano artefakti anlik goruntusu (TEST-CI-01 / TEST-ISO-02 guard)
        run: python scripts/pano_guard.py snapshot --out "${{ runner.temp }}/pano_md5.json"
      - name: Run tests with coverage
        # Olculen moduller .coveragerc [run] include ile tanimli
        # (--cov=<dosya/yolu> pytest-cov'da paket adi sayilir -> %0 "No data").
        # TEST-CI-01: -p no:cacheprovider (CI'da .pytest_cache gereksiz),
        # --timeout (asili test isi kilitlemesin), -x YOK (matris raporu tam olsun).
        run: |
          python -m pytest tests/ \
            -p no:cacheprovider \
            --timeout=${{ env.PYTEST_TIMEOUT_SN }} \
            --continue-on-collection-errors \
            --cov \
            --cov-config=.coveragerc \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            -v
      - name: Pano artefakti izolasyon kontrolu (testler gercek panoya yazdi mi?)
        if: always()
        run: python scripts/pano_guard.py check --in "${{ runner.temp }}/pano_md5.json"
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security scan (bandit)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install bandit
      - name: "Run bandit (kapi High; Medium bilgilendirici - SEC-BANDIT-01)"
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll || echo "::warning::bandit Medium bulgular var (B608 f-string SQL / B113 timeout) — SEC-BANDIT-01 backlog"
          bandit -r src/ -lll
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
