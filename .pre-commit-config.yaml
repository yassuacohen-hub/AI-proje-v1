repos:
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        language_version: python3

  - repo: https://github.com/sonicrules/safety
    rev: 1.0.0
    hooks:
      - id: safety
        language_version: python3

  # GUARD-ENC-01: degisen dosyalarda UTF-8 BOM / NUL / mojibake / ast.parse denetimi.
  # (Kodlama guard'i degisen dosyalari kendisi bulur: --kapsam git)
  - repo: local
    hooks:
      - id: kodlama-denetim
        name: kodlama denetimi (UTF-8 BOM/NUL/mojibake/sozdizimi)
        entry: python -X utf8 scripts/kodlama_denetim.py --kapsam git
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # MANDAL-CI-01 (D-253): goc dosyasi = defter kaydi ve kolon adlari Ingilizce
      # (D-251/1). Mandal DB'ye baglanir; bu yuzden always_run DEGIL --- yalnizca
      # sema/goc dosyasina dokunan commit tetikler. DB'siz ortamda sirali commit
      # engellenmez, semaya dokunan commit ise denetimsiz gecemez.
      - id: goc-defteri
        name: goc defteri mandali (dosya=kayit, kolon adi Ingilizce)
        entry: python -X utf8 tests/test_goc_defteri.py
        language: system
        pass_filenames: false
        files: ^(src/company_master/schema/|tests/test_goc_defteri\.py$|scripts/goc_defteri\.py$)
        stages: [pre-commit]

      # MANDAL-SAHNE-01 (D-301): kazara toplu sahneleme kapisi. Olculmus olay:
      # `7343cec` 22 dosya ile D-299'un iki testini yuttu. Mevcut mandal
      # `git add -A`'yi betiklerde yakalar, ajanin elle yazdigi komutu yakalamaz.
      # Bu kapi niyeti degil sonucu olcer; kacis yolu: SAHNE_TAVAN=<sayi>.
      - id: sahne-kapisi
        name: MANDAL-SAHNE-01 (tek commit'te dosya sayisi tavani)
        entry: python -X utf8 scripts/sahne_kapisi.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # MANDAL-D250-01: kimlik tamligi tek kapisi. DB'ye BAGLANMAZ (saf hesap),
      # bu yuzden always_run --- ikinci bir puan yolu acan herhangi bir commit de
      # tetiklesin. Agirlik toplami 10.0 bozulursa commit gecmez.
      - id: d250-kalite-puani
        name: D-250 mandali (agirlik 10.0, dogrulanmamis=0, surum/bayat, 0-10)
        entry: python -X utf8 tests/test_kalite_puani.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
