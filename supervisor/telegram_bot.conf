[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:telegram_bot]
command=python -m src.company_master.telegram_bot
directory=%(ENV_PWD)s/Huginn Data Insights
autostart=true
autorestart=true
startretries=10
startsecs=10
stopasgroup=true
priority=999
redirect_stderr=true
stdout_logfile=logs/telegram_bot.log
stdout_logfile_maxbytes=52428800
stdout_logfile_backups=10
environment=TELEGRAM_BOT_TOKEN=%(ENV_TELEGRAM_BOT_TOKEN)s,TELEGRAM_CHAT_ID=%(ENV_TELEGRAM_CHAT_ID)s
