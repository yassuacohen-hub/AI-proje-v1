[pytest]
pythonpath = src

# Kök dizinden `pytest` çalıştırıldığında yalnızca `tests/` taranır.
# Aksi halde `AI proje v1/` (submodule), `scripts/test_*.py`,
# `src/company_master/services/test_*.py` ve `workspace/external/...`
# de toplanır; aynı adlı modüller çakışıp "import file mismatch" verir
# (2026-09-14'te 77 toplama hatası gözlendi).
testpaths = tests

# Toplama sırasında hiçbir koşulda inilmeyecek dizinler.
norecursedirs =
    AI proje v1
    AI projet v1
    workspace
    .git
    .venv
    venv
    node_modules
    test_reports
    data
