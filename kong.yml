_format_version: "3.0"
_transform: true

# ================================================================
# KONG DECLARATIVE CONFIG - HUGINN DATA INSIGHTS
# Dual-IP Architecture: IP-1 (Public) | IP-2 (Enterprise/mTLS)
# ================================================================

# ------------------------------------------------------------
# SERVICES - Backend Service Definitions
# ------------------------------------------------------------
services:
  # --------------------------------------------------------
  # CLIENT WEB SERVICE (IP-1: Public Access via Kong)
  # Routes: /api/v1/* (public), /mirmir/* (SSE), /auth/*
  # --------------------------------------------------------
  - name: client-web-service
    url: http://hugin-api:8000
    protocol: http
    host: hugin-api
    port: 8000
    path: /
    retries: 3
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    tags:
      - "ip-1-public"
      - "client-facing"
    plugins:
      # Rate Limiting: Public API (100 req/min per IP)
      - name: rate-limiting
        route: client-web-service
        config:
          minute: 100
          hour: 1000
          policy: local
          fault_tolerant: true
          hide_client_headers: false
      # Correlation ID for tracing
      - name: correlation-id
        route: client-web-service
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true
      # IP Restriction: Block known bad actors (managed via separate list)
      - name: ip-restriction
        route: client-web-service
        config:
          deny: []
          whitelist: []
      # Request Size Limit: 10MB max
      - name: request-size-limiting
        route: client-web-service
        config:
          allowed_payload_size: 10485760
          require_content_length: true

  # --------------------------------------------------------
  # MUNINN ADMIN SERVICE (IP-2: Isolated, mTLS Required)
  # Routes: /admin/*, /muninn/*, /internal/*
  # --------------------------------------------------------
  - name: muninn-admin-service
    url: http://hugin-admin:8501
    protocol: http
    host: hugin-admin
    port: 8501
    path: /
    retries: 3
    connect_timeout: 10000
    write_timeout: 60000
    read_timeout: 60000
    tags:
      - "ip-2-enterprise"
      - "admin-facing"
      - "mtls-required"
    plugins:
      # mTLS Authentication (Certificate-based)
      - name: mtls-auth
        route: muninn-admin-service
        config:
          ca_certificates: ["/usr/local/kong/certs/ca.pem"]
          revocation_check: true
      # ACL: Only certified enterprise clients
      - name: acl
        route: muninn-admin-service
        config:
          allow: ["enterprise-tier", "holding-admin"]
          deny: []
          hide_groups_header: true
      # Rate Limiting: Stricter for admin (50 req/min)
      - name: rate-limiting
        route: muninn-admin-service
        config:
          minute: 50
          hour: 500
          policy: local
          fault_tolerant: true
      # Request/Response Transform: Strip internal headers
      - name: request-transformer
        route: muninn-admin-service
        config:
          remove:
            headers: ["x-forwarded-for", "x-real-ip"]
          add:
            headers: ["X-Internal-Request:true"]
      - name: response-transformer
        route: muninn-admin-service
        config:
          remove:
            headers: ["server", "x-powered-by"]

  # --------------------------------------------------------
  # ENTERPRISE API GATEWAY (IP-2: mTLS + OAuth2 for B2B Clients)
  # Routes: /enterprise/*, /webhook/*, /api/enterprise/*
  # --------------------------------------------------------
  - name: enterprise-api-service
    url: http://hugin-api:8000
    protocol: http
    host: hugin-api
    port: 8000
    path: /
    retries: 3
    connect_timeout: 10000
    write_timeout: 120000
    read_timeout: 120000
    tags:
      - "ip-2-enterprise"
      - "b2b-api"
      - "mtls-required"
      - "oauth2-required"
    plugins:
      # mTLS Authentication (Certificate-based)
      - name: mtls-auth
        route: enterprise-api-service
        config:
          ca_certificates: ["/usr/local/kong/certs/ca.pem"]
          revocation_check: true
      # OAuth2 Introspection (iyzico token validation)
      - name: oauth2-introspection
        route: enterprise-api-service
        config:
          introspection_url: https://api.iyzipay.com/oauth2/introspect
          client_id: ${IYZICO_API_KEY}
          client_secret: ${IYZICO_SECRET_KEY}
          timeout: 10000
          bearer_tokens_only: true
          hide_credentials: true
      # ACL: Enterprise clients only
      - name: acl
        route: enterprise-api-service
        config:
          allow: ["enterprise-api", "webhook-receiver"]
          deny: []
      # Rate Limiting: Enterprise tier (1000 req/min)
      - name: rate-limiting
        route: enterprise-api-service
        config:
          minute: 1000
          hour: 50000
          policy: redis
          redis_host: hugin-cache
          redis_port: 6379
          redis_database: 2
          fault_tolerant: true
      # Request Size Limit: 50MB for webhook payloads
      - name: request-size-limiting
        route: enterprise-api-service
        config:
          allowed_payload_size: 52428800
          require_content_length: true

  # --------------------------------------------------------
  # FRONTEND SERVICE (IP-1: Next.js Client Portal)
  # Routes: / (root), /dashboard/*, /reports/*
  # --------------------------------------------------------
  - name: frontend-service
    url: http://hugin-frontend:3000
    protocol: http
    host: hugin-frontend
    port: 3000
    path: /
    retries: 3
    connect_timeout: 10000
    write_timeout: 30000
    read_timeout: 30000
    tags:
      - "ip-1-public"
      - "frontend"
    plugins:
      - name: rate-limiting
        route: frontend-service
        config:
          minute: 200
          hour: 5000
          policy: local
      - name: correlation-id
        route: frontend-service
        config:
          header_name: X-Correlation-ID
          generator: uuid

  # --------------------------------------------------------
  # INTERNAL SERVICES (No direct external access - only via Kong internal)
  # --------------------------------------------------------
  - name: internal-api-service
    url: http://hugin-api:8000
    protocol: http
    host: hugin-api
    port: 8000
    path: /internal
    tags:
      - "internal-only"
    plugins:
      - name: ip-restriction
        config:
          allow: ["172.16.0.0/12"]  # Docker bridge network only
          deny: ["0.0.0.0/0"]

# ------------------------------------------------------------
# ROUTES - Path-based Routing Rules
# ------------------------------------------------------------
routes:
  # ---- CLIENT WEB ROUTES (IP-1) ----
  - name: client-api-v1
    service: client-web-service
    paths:
      - /api/v1
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    strip_path: false
    preserve_host: false
    https_redirect_status_code: 426
    tags: ["ip-1-public"]

  - name: client-mirmir-stream
    service: client-web-service
    paths:
      - /api/v1/mirmir
    methods: ["GET"]
    strip_path: false
    preserve_host: false
    tags: ["ip-1-public", "sse"]
    # SSE needs longer timeouts
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          hour: 200
          policy: local

  - name: client-auth
    service: client-web-service
    paths:
      - /auth
      - /login
      - /register
      - /oauth
    methods: ["GET", "POST", "OPTIONS"]
    strip_path: false
    tags: ["ip-1-public", "auth"]

  - name: client-webhook-receiver
    service: client-web-service
    paths:
      - /webhook
    methods: ["POST"]
    strip_path: false
    tags: ["ip-1-public", "webhook"]
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 52428800

  # ---- ENTERPRISE API ROUTES (IP-2) ----
  - name: enterprise-api-v1
    service: enterprise-api-service
    paths:
      - /enterprise
      - /api/enterprise
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    strip_path: false
    preserve_host: false
    tags: ["ip-2-enterprise", "mtls", "oauth2"]

  - name: enterprise-webhooks
    service: enterprise-api-service
    paths:
      - /webhook/enterprise
    methods: ["POST"]
    strip_path: false
    tags: ["ip-2-enterprise", "webhook", "mtls"]

  - name: enterprise-reports
    service: enterprise-api-service
    paths:
      - /reports
      - /api/reports
    methods: ["GET", "POST"]
    strip_path: false
    tags: ["ip-2-enterprise", "reports"]

  # ---- MUNINN ADMIN ROUTES (IP-2) ----
  - name: muninn-admin-panel
    service: muninn-admin-service
    paths:
      - /admin
      - /muninn
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    strip_path: false
    preserve_host: false
    tags: ["ip-2-enterprise", "admin", "mtls"]

  - name: muninn-internal-api
    service: muninn-admin-service
    paths:
      - /internal
    methods: ["GET", "POST"]
    strip_path: false
    tags: ["ip-2-enterprise", "internal"]

  # ---- FRONTEND ROUTES (IP-1) ----
  - name: frontend-root
    service: frontend-service
    paths:
      - /
    methods: ["GET", "HEAD"]
    strip_path: false
    tags: ["ip-1-public", "frontend"]

  - name: frontend-dashboard
    service: frontend-service
    paths:
      - /dashboard
      - /reports
      - /profile
      - /settings
      - /findeks
    methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    strip_path: false
    tags: ["ip-1-public", "frontend"]

  # ---- HEALTH CHECK ROUTES (Both IPs) ----
  - name: health-check-ip1
    service: client-web-service
    paths:
      - /health
      - /healthz
      - /ready
    methods: ["GET"]
    strip_path: false
    tags: ["ip-1-public", "health"]

  - name: health-check-ip2
    service: enterprise-api-service
    paths:
      - /health
      - /healthz
      - /ready
    methods: ["GET"]
    strip_path: false
    tags: ["ip-2-enterprise", "health"]

# ------------------------------------------------------------
# CONSUMERS - API Consumers (Enterprise Clients)
# ------------------------------------------------------------
consumers:
  # Enterprise clients will be added dynamically via Admin API
  # Example structure:
  # - username: enterprise-client-001
  #   custom_id: ENT-001
  #   tags: ["enterprise-api"]
  #   plugins:
  #     - name: acl
  #       config:
  #         allow: ["enterprise-api"]
  #     - name: rate-limiting
  #       config:
  #         minute: 1000
  #         policy: redis
  #         redis_host: hugin-cache
  #         redis_port: 6379
  #         redis_database: 2

# ------------------------------------------------------------
# PLUGINS - Global Plugins (Applied to all services/routes)
# ------------------------------------------------------------
plugins:
  # Global Request Transformation: Add security headers
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Content-Type-Options:nosniff"
          - "X-Frame-Options:DENY"
          - "X-XSS-Protection:1; mode=block"
          - "Referrer-Policy:strict-origin-when-cross-origin"
          - "Permissions-Policy:geolocation=(), microphone=(), camera=()"
      remove:
        headers: ["server", "x-powered-by"]

  # Global CORS (Configured per-service via route plugins in production)
  - name: cors
    config:
      origins:
        - "https://app.huginn.local"
        - "https://admin.huginn.local"
        - "https://api.huginn.local"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Correlation-ID
        - X-Requested-With
      exposed_headers:
        - X-Correlation-ID
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
      credentials: true
      max_age: 3600
      preflight_continue: false

  # Global Request Validation: Body size and content-type
  - name: request-transformer
    config:
      remove:
        headers: ["x-forwarded-for", "x-real-ip", "forwarded"]

# ------------------------------------------------------------
# CERTIFICATES - mTLS Certificates (Mounted from ./kong/certs)
# ------------------------------------------------------------
certificates:
  # CA Certificate for mTLS verification
  - cert: /usr/local/kong/certs/ca.pem
    key: /usr/local/kong/certs/ca.key
    tags: ["mtls-ca"]

  # Kong Server Certificate (for HTTPS on both IPs)
  - cert: /usr/local/kong/certs/kong-server.pem
    key: /usr/local/kong/certs/kong-server.key
    tags: ["kong-server"]

  # Client certificates for enterprise clients (added dynamically)
  # Example:
  # - cert: /usr/local/kong/certs/client-ent-001.pem
  #   key: /usr/local/kong/certs/client-ent-001.key
  #   tags: ["mtls-client", "enterprise-001"]

# ------------------------------------------------------------
# CA CERTIFICATES - Trusted CAs for mTLS
# ------------------------------------------------------------
ca_certificates:
  - cert: /usr/local/kong/certs/ca.pem
    tags: ["mtls-ca"]

# ------------------------------------------------------------
# UPSTREAMS - Load Balancing (Future: Multi-instance scaling)
# ------------------------------------------------------------
upstreams:
  - name: hugin-api-upstream
    algorithm: round-robin
    hash_on: none
    slots: 10000
    healthchecks:
      active:
        type: http
        http_path: /health
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 30
          http_failures: 3
          tcp_failures: 3
        timeout: 10
        concurrency: 10
      passive:
        healthy:
          successes: 5
        unhealthy:
          http_failures: 10
          tcp_failures: 10
    tags: ["api-upstream"]

  - name: hugin-frontend-upstream
    algorithm: round-robin
    slots: 1000
    healthchecks:
      active:
        type: http
        http_path: /api/health
        healthy:
          interval: 30
          successes: 2
        unhealthy:
          interval: 30
          http_failures: 3
        timeout: 10
    tags: ["frontend-upstream"]

# ------------------------------------------------------------
# TARGETS - Upstream Targets (Auto-populated from services)
# ------------------------------------------------------------
targets:
  - upstream: hugin-api-upstream
    target: hugin-api:8000
    weight: 100
    tags: ["api-target"]

  - upstream: hugin-frontend-upstream
    target: hugin-frontend:3000
    weight: 100
    tags: ["frontend-target"]

